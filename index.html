<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <link rel="icon" href="data:,">
    <title>DailyNews</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="masthead">
      <nav class="masthead__inner" aria-label="日报导航">
        <div class="publication-nav">
          <a class="brand" href="/" aria-label="返回最新一期">
            <span class="brand__name">DailyNews</span>
          </a>
          <div class="publication-menu" aria-label="页面目录">
            <!-- build:publication-menu -->
          </div>
          <label class="publication-select-label" for="publication-select">页面</label>
          <select class="publication-select" id="publication-select" aria-label="切换日报">
            <!-- build:publication-options -->
          </select>
        </div>
        <div class="date-nav">
          <button class="date-nav__button" data-direction="previous" type="button" aria-label="查看上一期">
            <span aria-hidden="true">←</span>
            <span class="date-nav__label">上一期</span>
          </button>
          <time class="date-nav__current" aria-live="polite">—</time>
          <button class="date-nav__button" data-direction="next" type="button" aria-label="查看下一期">
            <span class="date-nav__label">下一期</span>
            <span aria-hidden="true">→</span>
          </button>
        </div>
      </nav>
    </header>

    <aside class="submission-notice" id="submission-notice" role="status" hidden></aside>

    <noscript>
      <style>
        .date-nav__button,
        #content,
        #source-panel,
        #edition-status { display: none; }
      </style>
      <!-- build:noscript -->
    </noscript>

    <main id="content" tabindex="-1">
      <p class="status" role="status">正在加载日报…</p>
    </main>
    <p class="visually-hidden" id="edition-status" role="status" aria-live="polite"></p>

    <dialog class="source-panel" id="source-panel" aria-labelledby="source-panel-title">
      <header class="source-panel__header">
        <div>
          <p class="source-panel__eyebrow">来源清单</p>
          <h2 class="source-panel__title" id="source-panel-title">全部来源</h2>
        </div>
        <button class="source-panel__close" type="button" aria-label="关闭来源面板">关闭 ×</button>
      </header>
      <ol class="source-panel__list"></ol>
    </dialog>

    <script type="application/json" id="publication-context"><!-- build:publication-context --></script>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
