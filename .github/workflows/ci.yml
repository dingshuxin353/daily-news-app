name: CI

on:
  pull_request:
    branches:
      - main
      - "version/**"
  push:
    branches:
      - main
      - "version/**"

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dailynews_ci
          POSTGRES_USER: dailynews_ci
          POSTGRES_PASSWORD: dailynews_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dailynews_ci -d dailynews_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://dailynews_ci:dailynews_ci_password@127.0.0.1:5432/dailynews_ci
      MAIL_MODE: fake

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Test cloud runtime
        run: npm run test:cloud

      - name: Test PostgreSQL migrations
        run: npm run test:cloud:integration

      - name: Build static site
        run: npm run build

      - name: Build cloud runtime
        run: npm run build:cloud
